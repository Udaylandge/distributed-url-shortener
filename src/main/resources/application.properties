spring.application.name=distributed-url-shortener

server.port=8080

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/URL_SHORTENER_DB

# Thymeleaf
spring.thymeleaf.cache=false

# Logging
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Redis Configuration (optional - app degrades gracefully if Redis unavailable)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=500ms

# Cache - use NONE if Redis is unavailable, REDIS when Redis is running
spring.cache.type=none

# App Base URL
app.base-url=http://localhost:8080