<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | URLSHORTNER</title>
    
    <!-- Google Fonts: Inter & Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom Auth CSS -->
    <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css">
</head>
<body class="auth-body d-flex align-items-center justify-content-center min-vh-100">

    <!-- ✅ Back to Home Link (Top Left) -->
    <a th:href="@{/}" href="/" class="back-home-link">
        <i class="fa-solid fa-arrow-left me-2"></i>Back to Home
    </a>

    <!-- Floating Background Shapes -->
    <div class="auth-shape shape-1"></div>
    <div class="auth-shape shape-2"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                
                <!-- Glass Card -->
                <div class="auth-card p-4 p-sm-5 shadow-2xl rounded-5">
                    
                    <!-- Logo & Header -->
                    <div class="text-center mb-4">
                        <div class="logo-icon mx-auto mb-3 shadow">
                            <i class="fa-solid fa-link"></i>
                        </div>
                        <h3 class="fw-bold mb-1 brand-title">URLSHORTNER</h3>
                        <p class="text-muted-light small">Distributed URL Management Platform</p>
                    </div>

                    <!-- ✅ Error Message for Invalid Credentials -->
                    <div th:if="${param.error}" class="alert alert-danger custom-alert d-flex align-items-center mb-4" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-2 fs-5"></i>
                        <div>Invalid email address or password.</div>
                    </div>

                    <!-- ✅ Success Message After Registration -->
                    <div th:if="${param.registered}" class="alert alert-success custom-alert d-flex align-items-center mb-4" role="alert">
                        <i class="fa-solid fa-circle-check me-2 fs-5"></i>
                        <div>Account created successfully. Please sign in.</div>
                    </div>

                    <div th:if="${param.logout}" class="alert alert-info custom-alert d-flex align-items-center mb-4" role="alert">
                        <i class="fa-solid fa-circle-info me-2 fs-5"></i>
                        <div>You have been logged out securely.</div>
                    </div>

                    <!-- Login Form -->
                    <form th:action="@{/login}" method="post" id="loginForm" novalidate>
                        
                        <!-- Email Input -->
                        <div class="mb-3">
                            <label for="email" class="form-label text-light small fw-medium">Email Address</label>
                            <div class="input-group custom-input-group">
                                <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="username" placeholder="you@example.com" required autocomplete="email">
                            </div>
                            <div class="invalid-feedback inline-error">Please enter a valid email address.</div>
                        </div>

                        <!-- Password Input -->
                        <div class="mb-3">
                            <label for="password" class="form-label text-light small fw-medium">Password</label>
                            <div class="input-group custom-input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                                <button class="btn toggle-password" type="button" tabindex="-1"><i class="fa-regular fa-eye"></i></button>
                            </div>
                            <div class="invalid-feedback inline-error">Please enter your password.</div>
                        </div>

                        <!-- ✅ Remember Me & Forgot Password -->
                        <div class="d-flex justify-content-between align-items-center mb-4 small">
                            <div class="form-check">
                                <input class="form-check-input custom-checkbox" type="checkbox" id="rememberMe" name="remember-me">
                                <label class="form-check-label text-muted-light cursor-pointer" for="rememberMe">
                                    Remember me
                                </label>
                            </div>
                            <a href="#" class="forgot-link">Forgot Password?</a>
                        </div>

                        <!-- ✅ Submit Button with Loading Spinner Support -->
                        <button type="submit" class="btn btn-gradient w-100 py-3 fw-bold shadow-lg d-flex align-items-center justify-content-center" id="submitBtn">
                            <span class="btn-text">Sign In <i class="fa-solid fa-arrow-right-to-bracket ms-2"></i></span>
                            <span class="spinner-border spinner-border-sm d-none ms-2" role="status" aria-hidden="true"></span>
                        </button>
                    </form>

                    <!-- Footer Link -->
                    <div class="text-center mt-4 pt-3 border-top border-light border-opacity-10 small">
                        <span class="text-muted-light">Don't have an account?</span> 
                        <a th:href="@{/register}" href="/register" class="text-primary-light fw-bold text-decoration-none ms-1">Create one now</a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & Custom JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/auth.js}" src="/js/auth.js"></script>
</body>
</html>
