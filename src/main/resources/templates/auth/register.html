<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Free Account | Shortify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="bg-light text-dark min-vh-100 d-flex align-items-center justify-content-center">

<div class="container py-5">
    <div class="card p-4 mx-auto shadow-sm border-0 bg-white" style="max-width: 480px; width: 100%;">
        <div class="text-center mb-4">
            <a th:href="@{/}" class="text-decoration-none">
                <h2 class="fw-bold brand-text text-dark"><i class="fa-solid fa-link text-primary me-2"></i>Shortify</h2>
            </a>
            <p class="text-secondary small mt-1">Start shortening, tracking, and securing your links</p>
        </div>

        <div th:if="${error}" class="alert alert-danger py-2 small mb-3" th:text="${error}"></div>

        <form id="registerForm" th:action="@{/register}" th:object="${user}" method="post">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="mb-3">
                <label for="fullName" class="form-label text-dark small fw-semibold">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" class="form-control" id="fullName" th:field="*{fullName}" placeholder="John Doe" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="regEmail" class="form-label text-dark small fw-semibold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" class="form-control" id="regEmail" th:field="*{email}" placeholder="you@domain.com" required autocomplete="email">
                </div>
            </div>

            <div class="mb-3">
                <label for="regPassword" class="form-label text-dark small fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" id="regPassword" th:field="*{password}" placeholder="At least 8 characters" required minlength="8">
                    <button class="btn btn-outline-secondary toggle-password" type="button"><i class="fa-solid fa-eye"></i></button>
                </div>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label text-dark small fw-semibold">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-check-double"></i></span>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter password" required>
                </div>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="termsCheck" required>
                <label class="form-check-label text-secondary small" for="termsCheck">
                    I agree to Shortify Terms of Service & Privacy Policy
                </label>
            </div>

            <button type="submit" id="regSubmitBtn" class="btn btn-primary w-100 py-2.5 rounded-pill fw-bold mb-3">
                <span class="btn-text"><i class="fa-solid fa-user-plus me-2"></i>Create Account</span>
                <span class="spinner-border spinner-border-sm d-none ms-2"></span>
            </button>
        </form>

        <div class="text-center mt-3 border-top border-slate-200 pt-3">
            <span class="text-secondary small">Already have an account?</span>
            <a th:href="@{/login}" class="text-primary text-decoration-none fw-bold ms-1 small">Sign In</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
