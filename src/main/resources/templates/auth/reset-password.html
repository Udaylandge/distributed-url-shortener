<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | Shortify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="bg-dark text-light min-vh-100 d-flex align-items-center justify-content-center">
<div class="container py-5">
    <div class="card glass-card p-4 mx-auto shadow-lg" style="max-width: 440px; width: 100%;">
        <div class="text-center mb-4">
            <a th:href="@{/}" class="text-decoration-none">
                <h2 class="fw-bold brand-text text-white"><i class="fa-solid fa-link text-primary me-2"></i>Shortify</h2>
            </a>
            <p class="text-secondary small mt-1">Set a new password for your account</p>
        </div>

        <div th:if="${error}" class="alert alert-danger py-2 small mb-3" th:text="${error}"></div>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="token" th:value="${token}" />

            <div class="mb-3">
                <label for="password" class="form-label text-light small fw-medium">New Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="At least 8 characters" required minlength="8">
                </div>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label text-light small fw-medium">Confirm New Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-check-double"></i></span>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Re-enter new password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold mb-3"><i class="fa-solid fa-shield-check me-2"></i>Update Password</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
