<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | Shortify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="bg-light text-dark min-vh-100 d-flex align-items-center justify-content-center">
<div class="container text-center py-5">
    <div class="card border-warning border-opacity-25 shadow-sm mx-auto p-5 bg-white" style="max-width: 520px;">
        <h1 class="display-1 fw-bold text-warning mb-0">500</h1>
        <h3 class="fw-bold text-dark mb-2">Internal Server Error</h3>
        <p class="text-secondary mb-4">Something went wrong on our end. Please try again or return to the dashboard.</p>
        <div>
            <a th:href="@{/dashboard}" class="btn btn-primary rounded-pill px-4 fw-bold"><i class="fa-solid fa-gauge me-2"></i>Go to Dashboard</a>
        </div>
    </div>
</div>
</body>
</html>
