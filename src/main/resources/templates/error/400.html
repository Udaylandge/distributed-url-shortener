<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 - Bad Request | Shortify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 3rem; text-align: center; max-width: 500px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .error-code { font-size: 5rem; font-weight: 700; background: linear-gradient(135deg, #3b82f6, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>
<div class="container">
    <div class="error-card mx-auto">
        <div class="mb-3"><i class="fa-solid fa-triangle-exclamation fa-4x text-info"></i></div>
        <h1 class="error-code">400</h1>
        <h3 class="fw-bold mb-3">Invalid Request</h3>
        <p class="text-secondary mb-4" th:text="${message} ?: 'The request syntax or parameter was invalid.'">The request syntax or parameter was invalid.</p>
        <a th:href="@{/}" class="btn btn-primary btn-lg rounded-pill px-4"><i class="fa-solid fa-house me-2"></i>Back to Home</a>
    </div>
</div>
</body>
</html>
