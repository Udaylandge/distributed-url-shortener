<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="sidebar" id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-white sidebar collapse border-end border-slate-200 min-vh-100 sidebar-custom">
    <div class="position-sticky pt-3 sidebar-sticky">
        <ul class="nav flex-column gap-1 px-2">
            <li class="nav-item">
                <a class="nav-link text-secondary rounded-3 px-3 py-2" th:classappend="${activeNav == 'dashboard'} ? 'active bg-primary-subtle text-primary fw-bold' : ''" th:href="@{/dashboard}">
                    <i class="fa-solid fa-chart-pie me-2"></i>Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-secondary rounded-3 px-3 py-2" th:classappend="${activeNav == 'create'} ? 'active bg-primary-subtle text-primary fw-bold' : ''" th:href="@{/urls/create}">
                    <i class="fa-solid fa-plus-circle me-2"></i>Shorten URL
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-secondary rounded-3 px-3 py-2" th:classappend="${activeNav == 'manage'} ? 'active bg-primary-subtle text-primary fw-bold' : ''" th:href="@{/urls/manage}">
                    <i class="fa-solid fa-list-check me-2"></i>My Short Links
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-secondary rounded-3 px-3 py-2" th:classappend="${activeNav == 'analytics'} ? 'active bg-primary-subtle text-primary fw-bold' : ''" th:href="@{/analytics}">
                    <i class="fa-solid fa-chart-line me-2"></i>Analytics
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-secondary rounded-3 px-3 py-2" th:classappend="${activeNav == 'profile'} ? 'active bg-primary-subtle text-primary fw-bold' : ''" th:href="@{/profile}">
                    <i class="fa-solid fa-user-gear me-2"></i>Account & Profile
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-secondary rounded-3 px-3 py-2" th:classappend="${activeNav == 'trash'} ? 'active bg-danger-subtle text-danger fw-bold' : ''" th:href="@{/urls/trash}">
                    <i class="fa-solid fa-trash-can me-2"></i>Recycle Bin
                </a>
            </li>

            <li sec:authorize="hasRole('ADMIN')" class="nav-item mt-3 pt-3 border-top border-slate-200">
                <span class="px-3 small text-muted fw-bold text-uppercase" style="font-size: 0.75rem;">Admin Panel</span>
                <a class="nav-link text-warning rounded-3 px-3 py-2 mt-1" th:href="@{/admin/panel}">
                    <i class="fa-solid fa-shield-halved me-2"></i>Admin Dashboard
                </a>
            </li>
        </ul>
    </div>
</nav>
</body>
</html>
