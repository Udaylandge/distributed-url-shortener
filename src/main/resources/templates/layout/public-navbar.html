<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="public-navbar" class="navbar navbar-expand-lg navbar-light bg-white border-bottom border-slate-200 sticky-top px-3 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center" th:href="@{/}">
            <div class="brand-icon me-2 rounded-3 p-1 text-white" style="background: linear-gradient(135deg, #2563eb, #7c3aed);">
                <i class="fa-solid fa-link"></i>
            </div>
            <span class="fs-4 text-dark fw-bold">Shortify</span>
        </a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#publicNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="publicNav">
            <ul class="navbar-menu me-auto mb-2 mb-lg-0 list-unstyled d-flex align-items-center gap-4 ms-lg-4">
                <li><a th:href="@{/}" class="text-dark fw-medium text-decoration-none small">Home</a></li>
                <li><a href="#features" class="text-secondary text-decoration-none small">Features</a></li>
                <li><a href="#api" class="text-secondary text-decoration-none small">Developer API</a></li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <div sec:authorize="isAuthenticated()">
                    <a th:href="@{/dashboard}" class="btn btn-primary rounded-pill px-4 btn-sm fw-bold"><i class="fa-solid fa-gauge me-2"></i>Dashboard</a>
                </div>
                <div sec:authorize="!isAuthenticated()">
                    <a th:href="@{/login}" class="btn btn-outline-secondary rounded-pill px-3 btn-sm me-2">Sign In</a>
                    <a th:href="@{/register}" class="btn btn-primary rounded-pill px-3 btn-sm fw-bold">Get Started Free</a>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
