<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Shortify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>
<body class="dashboard-body">

<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar :: sidebar}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-4 border-bottom border-secondary border-opacity-25">
                <h1 class="h2 text-white fw-bold"><i class="fa-solid fa-shield-halved text-warning me-2"></i>Admin Dashboard</h1>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card bg-dark bg-opacity-50 border-warning border-opacity-25 p-3 rounded-4">
                        <div class="text-secondary extra-small fw-bold text-uppercase">Total Users</div>
                        <div class="fs-3 fw-bold text-warning mt-1" th:text="${totalUsers}">0</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-dark bg-opacity-50 border-secondary border-opacity-25 p-3 rounded-4">
                        <div class="text-secondary extra-small fw-bold text-uppercase">Active Users</div>
                        <div class="fs-3 fw-bold text-success mt-1" th:text="${activeUsers}">0</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-dark bg-opacity-50 border-secondary border-opacity-25 p-3 rounded-4">
                        <div class="text-secondary extra-small fw-bold text-uppercase">System URLs</div>
                        <div class="fs-3 fw-bold text-white mt-1" th:text="${totalUrls}">0</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-dark bg-opacity-50 border-secondary border-opacity-25 p-3 rounded-4">
                        <div class="text-secondary extra-small fw-bold text-uppercase">System Clicks</div>
                        <div class="fs-3 fw-bold text-info mt-1" th:text="${totalClicks}">0</div>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-3 mb-4">
                <a th:href="@{/admin/users}" class="btn btn-warning text-dark fw-bold rounded-pill px-4"><i class="fa-solid fa-users me-2"></i>Manage All Users</a>
                <a th:href="@{/admin/urls}" class="btn btn-outline-light rounded-pill px-4"><i class="fa-solid fa-link me-2"></i>Manage All System URLs</a>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
