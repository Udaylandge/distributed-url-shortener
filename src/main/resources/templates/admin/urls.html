<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All System URLs | Shortify Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>
<body class="dashboard-body">

<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar :: sidebar}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-4 border-bottom border-secondary border-opacity-25">
                <h1 class="h2 text-white fw-bold"><i class="fa-solid fa-link text-warning me-2"></i>All System URLs</h1>
                <a th:href="@{/admin/panel}" class="btn btn-outline-light btn-sm rounded-pill"><i class="fa-solid fa-arrow-left me-1"></i>Admin Dashboard</a>
            </div>

            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card bg-dark bg-opacity-50 border-secondary border-opacity-25 rounded-4 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-dark table-hover align-middle mb-0">
                            <thead>
                            <tr>
                                <th>Short URL / Code</th>
                                <th>Target Destination</th>
                                <th>Owner</th>
                                <th>Clicks</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="url : ${urlPage.content}">
                                <td>
                                    <a th:href="${url.shortUrl}" target="_blank" class="fw-bold text-primary text-decoration-none" th:text="${url.shortUrl}">http://localhost/abc</a>
                                </td>
                                <td class="text-truncate text-secondary" style="max-width: 300px;" th:text="${url.originalUrl}">Destination</td>
                                <td class="small text-info" th:text="${url.createdBy}">Owner</td>
                                <td><span class="badge bg-secondary" th:text="${url.clickCount}">0</span></td>
                                <td>
                                    <form th:action="@{'/admin/urls/delete/' + ${url.id}}" method="post" class="d-inline" onsubmit="return confirm('Purge this URL from system?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill"><i class="fa-solid fa-trash"></i> Delete</button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
