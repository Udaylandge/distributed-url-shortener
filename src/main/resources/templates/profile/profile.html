<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account & Profile | Shortify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="bg-light text-dark">

<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar :: sidebar}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-4 border-bottom border-slate-200">
                <h1 class="h2 text-dark fw-bold"><i class="fa-solid fa-user-gear text-primary me-2"></i>Account & Profile Settings</h1>
            </div>

            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row g-4">
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm p-4 bg-white mb-4">
                        <h5 class="card-title text-dark fw-bold mb-3"><i class="fa-solid fa-id-card text-primary me-2"></i>Profile Information</h5>
                        <form th:action="@{/profile/update}" method="post">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="mb-3">
                                <label for="email" class="form-label text-secondary small fw-bold text-uppercase">Email Address (Read-Only)</label>
                                <input type="email" class="form-control bg-light" id="email" th:value="${user.email}" readonly>
                            </div>

                            <div class="mb-3">
                                <label for="fullName" class="form-label text-dark small fw-semibold">Full Name</label>
                                <input type="text" class="form-control" id="fullName" name="fullName" th:value="${user.fullName}" required>
                            </div>

                            <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold"><i class="fa-solid fa-floppy-disk me-2"></i>Update Profile</button>
                        </form>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm p-4 bg-white mb-4">
                        <h5 class="card-title text-dark fw-bold mb-3"><i class="fa-solid fa-lock text-warning me-2"></i>Security & Password</h5>
                        <form th:action="@{/profile/change-password}" method="post">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="mb-3">
                                <label for="currentPassword" class="form-label text-dark small fw-semibold">Current Password</label>
                                <input type="password" class="form-control" id="currentPassword" name="currentPassword" required>
                            </div>

                            <div class="mb-3">
                                <label for="newPassword" class="form-label text-dark small fw-semibold">New Password</label>
                                <input type="password" class="form-control" id="newPassword" name="newPassword" required minlength="8">
                            </div>

                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label text-dark small fw-semibold">Confirm New Password</label>
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                            </div>

                            <button type="submit" class="btn btn-warning text-dark rounded-pill px-4 fw-bold"><i class="fa-solid fa-shield-halved me-2"></i>Change Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
