<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Protected Link | Shortify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="bg-light text-dark min-vh-100 d-flex align-items-center justify-content-center">
<div class="container py-5">
    <div class="card border-0 shadow-sm mx-auto text-center p-5 bg-white" style="max-width: 460px;">
        <div class="rounded-circle bg-primary bg-opacity-10 d-inline-flex align-items-center justify-content-center mx-auto mb-4" style="width: 80px; height: 80px;">
            <i class="fa-solid fa-lock fa-3x text-primary"></i>
        </div>
        <h3 class="fw-bold text-dark mb-2">Password Protected Link</h3>
        <p class="text-secondary small mb-4">Please enter the passkey set by the link owner to proceed.</p>

        <div th:if="${error}" class="alert alert-danger py-2 small mb-3" th:text="${error}"></div>

        <form th:action="@{'/url/pass/' + ${shortCode}}" method="post">
            <div class="mb-3 text-start">
                <label for="password" class="form-label small text-dark fw-semibold">Passkey / Password</label>
                <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Enter link password..." required autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold mb-2"><i class="fa-solid fa-key me-2"></i>Unlock Link</button>
        </form>
    </div>
</div>
</body>
</html>
