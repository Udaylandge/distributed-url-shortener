<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Disabled | Shortify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="bg-light text-dark min-vh-100 d-flex align-items-center justify-content-center">
<div class="container py-5">
    <div class="card border-warning border-opacity-25 mx-auto text-center p-5 shadow-sm bg-white" style="max-width: 520px;">
        <div class="rounded-circle bg-warning bg-opacity-10 d-inline-flex align-items-center justify-content-center mx-auto mb-4" style="width: 80px; height: 80px;">
            <i class="fa-solid fa-ban fa-3x text-warning"></i>
        </div>
        <h2 class="fw-bold text-dark mb-2">Link Disabled</h2>
        <p class="text-secondary mb-4">This short link has been temporarily deactivated by its creator or an administrator.</p>
        <div class="p-3 bg-light rounded-3 mb-4 text-start small border border-slate-200">
            <div class="text-muted">Short Code: <span class="text-dark fw-bold" th:text="${url.shortCode}">abc123</span></div>
            <div class="text-muted">Status: <span class="badge bg-warning bg-opacity-10 text-warning border border-warning border-opacity-25">Inactive</span></div>
        </div>
        <div>
            <a th:href="@{/}" class="btn btn-primary rounded-pill px-4 fw-bold"><i class="fa-solid fa-house me-2"></i>Go to Shortify</a>
        </div>
    </div>
</div>
</body>
</html>
