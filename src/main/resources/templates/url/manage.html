<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Short Links | Shortify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="bg-light text-dark">

<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar :: sidebar}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-3 mb-4 border-bottom border-slate-200">
                <h1 class="h2 text-dark fw-bold"><i class="fa-solid fa-list-check text-primary me-2"></i>My Short Links</h1>
                <div class="d-flex gap-2">
                    <a th:href="@{/urls/export/csv}" class="btn btn-outline-secondary btn-sm rounded-pill"><i class="fa-solid fa-file-csv me-1 text-primary"></i>Export CSV</a>
                    <a th:href="@{/urls/create}" class="btn btn-primary btn-sm rounded-pill px-3"><i class="fa-solid fa-plus me-1"></i>New Link</a>
                </div>
            </div>

            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Search Bar -->
            <div class="card border-0 shadow-sm p-3 mb-4 bg-white">
                <form th:action="@{/urls/manage}" method="get" class="row g-2 align-items-center">
                    <div class="col">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-magnifying-glass text-secondary"></i></span>
                            <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Search by short code, custom alias, or target URL...">
                        </div>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary rounded-pill px-4">Search</button>
                        <a th:href="@{/urls/manage}" class="btn btn-outline-secondary rounded-pill px-3 ms-1" th:if="${keyword}">Reset</a>
                    </div>
                </form>
            </div>

            <!-- Links Table -->
            <div class="card border-0 shadow-sm mb-4 bg-white">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead>
                            <tr>
                                <th>Short URL / Code</th>
                                <th>Target Destination</th>
                                <th>Clicks</th>
                                <th>Status</th>
                                <th>Expiry</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="url : ${urlPage.content}">
                                <td>
                                    <div>
                                        <a th:href="${url.shortUrl}" target="_blank" class="fw-bold text-primary text-decoration-none" th:text="${url.shortUrl}">http://localhost/abc</a>
                                        <small th:if="${url.customAlias}" class="badge bg-primary-subtle text-primary ms-1" th:text="${url.customAlias}"></small>
                                    </div>
                                </td>
                                <td class="text-truncate text-secondary" style="max-width: 250px;" th:text="${url.originalUrl}">https://example.com</td>
                                <td><span class="badge bg-light text-dark border" th:text="${url.clickCount}">0</span></td>
                                <td>
                                    <form th:action="@{'/urls/toggle-active/' + ${url.id}}" method="post" class="d-inline">
                                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <button type="submit" class="border-0 bg-transparent p-0" title="Click to toggle active status">
                                            <span th:if="${url.active}" class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25"><i class="fa-solid fa-check me-1"></i>Active</span>
                                            <span th:if="${!url.active}" class="badge bg-warning bg-opacity-10 text-warning border border-warning border-opacity-25"><i class="fa-solid fa-pause me-1"></i>Disabled</span>
                                        </button>
                                    </form>
                                    <span th:if="${url.password != null}" class="badge bg-primary-subtle text-primary ms-1"><i class="fa-solid fa-lock"></i></span>
                                    <span th:if="${url.oneTime}" class="badge bg-purple-subtle text-purple ms-1" style="background:#f3e8ff; color:#7c3aed;">1-Time</span>
                                </td>
                                <td class="small text-secondary" th:text="${url.expiryDate != null ? #temporals.format(url.expiryDate, 'dd MMM yyyy') : 'No Expiry'}">Expiry</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-secondary rounded-pill me-1 copy-btn" th:data-url="${url.shortUrl}" title="Copy Link"><i class="fa-solid fa-copy"></i></button>
                                    <a th:href="@{'/urls/qr/' + ${url.id}}" target="_blank" class="btn btn-sm btn-outline-primary rounded-pill me-1" title="View/Download QR"><i class="fa-solid fa-qrcode"></i></a>
                                    <form th:action="@{'/urls/delete/' + ${url.id}}" method="post" class="d-inline" onsubmit="return confirm('Move this short link to trash bin?');">
                                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill" title="Move to Trash"><i class="fa-solid fa-trash"></i></button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(urlPage.content)}">
                                <td colspan="6" class="text-center py-4 text-secondary">No short links found matching your search.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Pagination Footer -->
                <div class="card-footer py-3 d-flex justify-content-between align-items-center bg-white border-top border-slate-200" th:if="${totalPages > 1}">
                    <span class="small text-secondary" th:text="'Page ' + (${currentPage} + 1) + ' of ' + ${totalPages}">Page 1 of 5</span>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link text-dark" th:href="@{/urls/manage(page=${currentPage - 1}, keyword=${keyword})}">Previous</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                            <a class="page-link text-dark" th:href="@{/urls/manage(page=${currentPage + 1}, keyword=${keyword})}">Next</a>
                        </li>
                    </ul>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
